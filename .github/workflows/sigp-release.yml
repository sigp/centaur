# sigp/centaur only. Builds the images changed or owned by this fork, mirrors
# the remaining chart images from upstream's merge-base, and publishes a chart
# whose values pin every image to this fork commit. Upstream's
# publish-images.yml and release-chart.yml need Paradigm's Depot builders and
# its ghcr.io namespace, so they can't run here.
name: sigp release

"on":
  push:
    branches: [main, "sigp/**"]
    paths:
      - .github/workflows/sigp-release.yml
      - .github/scripts/chart-images.sh
      - .agents/skills/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - services/api-rs/**
      # The agent image copies the sandbox runtime, tools, workflows, and
      # baked-in harness files below.
      - services/sandbox/**
      - tools/**
      - workflows/**
      # The api-rs image installs the Python workflow host and SDK.
      - services/workflow-python/**
      - centaur_sdk/**
      - contrib/chart/**
      - services/console/**
      - services/mattermostbot/**
      # The mattermostbot image copies harness/ for its footer's default models.
      - harness/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: sigp-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: sigp/centaur
  RUST_BUILD_PROFILE: release

jobs:
  api-rs:
    if: github.repository == 'sigp/centaur'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the full commit SHA, which is how a deployment pins it.
      - name: Build and push centaur-api-rs
        run: |
          set -euo pipefail
          image="$REGISTRY/$NAMESPACE/centaur-api-rs"
          docker buildx build . \
            --file services/api-rs/Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max" \
            --tag "$image:$GITHUB_SHA" \
            --push

  mattermostbot:
    if: github.repository == 'sigp/centaur'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push centaur-mattermostbot
        run: |
          set -euo pipefail
          image="$REGISTRY/$NAMESPACE/centaur-mattermostbot"
          docker buildx build . \
            --file services/mattermostbot/Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max" \
            --tag "$image:$GITHUB_SHA" \
            --push

  console:
    if: github.repository == 'sigp/centaur'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile builds the Console's single-page app from the pnpm
      # workspace, so the build context is the repository root.
      - name: Build and push centaur-console
        run: |
          set -euo pipefail
          image="$REGISTRY/$NAMESPACE/centaur-console"
          docker buildx build . \
            --file services/console/Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max" \
            --tag "$image:$GITHUB_SHA" \
            --push

  agent:
    if: github.repository == 'sigp/centaur'
    runs-on: ubuntu-24.04
    # The sandbox image builds harness-server and a large toolchain without
    # Depot's remote cache; leave a full workday for a cold runner.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push centaur-agent
        run: |
          set -euo pipefail
          image="$REGISTRY/$NAMESPACE/centaur-agent"
          docker buildx build . \
            --file services/sandbox/Dockerfile \
            --target sandbox \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg "RUST_BUILD_PROFILE=$RUST_BUILD_PROFILE" \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max" \
            --tag "$image:$GITHUB_SHA" \
            --push

  mirror:
    if: github.repository == 'sigp/centaur'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror upstream chart images
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/paradigmxyz/centaur.git
          git fetch --no-tags upstream main
          base="$(git merge-base "$GITHUB_SHA" upstream/main)"
          base7="${base::7}"

          while read -r image; do
            case "$image" in
              centaur-api-rs|centaur-console|centaur-mattermostbot|centaur-agent)
                continue
                ;;
            esac
            source="$REGISTRY/paradigmxyz/centaur/$image:sha-$base7"
            target="$REGISTRY/$NAMESPACE/$image:$GITHUB_SHA"
            token="$(
              curl --fail --silent --show-error \
                "https://ghcr.io/token?scope=repository:paradigmxyz/centaur/$image:pull" |
                jq -r '.token'
            )"
            status="$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/paradigmxyz/centaur/$image/manifests/sha-$base7"
            )"
            if [[ "$status" != 2* ]]; then
              echo "missing upstream image: $source (HTTP $status)" >&2
              exit 1
            fi
            # GHCR can briefly deny the first push into a package it just
            # created, so retry before failing.
            for attempt in 1 2 3; do
              docker buildx imagetools create --tag "$target" "$source" && break
              [[ $attempt -lt 3 ]] || exit 1
              sleep $((attempt * 20))
            done
          done < <(.github/scripts/chart-images.sh list contrib/chart/values.yaml)

  chart:
    needs: [api-rs, console, mattermostbot, agent, mirror]

    if: github.repository == 'sigp/centaur'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      # Published as <upstream chart version>-sigp-<commit>: it names exactly
      # what was built, and never collides with upstream's release of a version.
      - name: Package and push the chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chart_dir="$RUNNER_TEMP/chart"
          cp -a contrib/chart "$chart_dir"
          .github/scripts/chart-images.sh stamp \
            "$chart_dir" "$REGISTRY/$NAMESPACE" "$GITHUB_SHA"
          helm repo add onepassword https://1password.github.io/connect-helm-charts
          helm dependency build "$chart_dir"
          helm lint "$chart_dir"
          version="$(yq -r '.version' "$chart_dir/Chart.yaml")-sigp-${GITHUB_SHA::7}"
          helm package "$chart_dir" \
            --version "$version" \
            --destination "$RUNNER_TEMP"
          .github/scripts/chart-images.sh controller \
            "$chart_dir" "$RUNNER_TEMP/agent-sandbox"
          helm lint "$RUNNER_TEMP/agent-sandbox"
          helm package "$RUNNER_TEMP/agent-sandbox" \
            --version "$version" \
            --destination "$RUNNER_TEMP"
          printf '%s' "$GHCR_TOKEN" | helm registry login "$REGISTRY" \
            --username "$GITHUB_ACTOR" \
            --password-stdin
          helm push "$RUNNER_TEMP/centaur-$version.tgz" \
            "oci://$REGISTRY/$NAMESPACE/charts"
          helm push "$RUNNER_TEMP/agent-sandbox-$version.tgz" \
            "oci://$REGISTRY/$NAMESPACE/charts"
